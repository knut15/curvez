name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Storybook 10 + Next 16 은 Node 24 에서 확인했다. Node 20 에서
          # `react-remove-scroll is not in cache` 로 깨진 사례가 이슈에 있다.
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 스토리 테스트는 실제 브라우저에서 돈다. 대비·포커스 링·line-clamp 처럼
      # 이 디자인 시스템이 값으로 정한 것은 레이아웃 계산을 거쳐야 판정된다.
      - run: pnpm --filter handwork exec playwright install --with-deps chromium

      # 게이트 순서는 싼 것부터다. 먼저 깨지는 것이 먼저 보고돼야 원인을 좁히는 비용이 싸다.
      # 명령은 .curvez/profile.json 의 commands 와 문자열까지 같아야 한다.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      # 아래 셋은 profile 의 commands 에 없는 이 프로젝트 고유 게이트다.
      - run: pnpm --filter handwork exec storybook build --output-dir /tmp/storybook-static
      - run: node apps/handwork/scripts/check-contrast.mjs
      - run: node apps/handwork/scripts/export-tokens.mjs --check
