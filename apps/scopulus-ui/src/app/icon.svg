<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- scopulus — IAU 행성 지형 명명 용어(불규칙한 절벽)에서 온 이름. 마크는 그 지형이 있는 행성이다. -->
  <style>
    .planet { fill: #15171A }
    .crater { fill: #9AA1A6 }
    .scopulus { fill: #E8182E }
    @media (prefers-color-scheme: dark) {
      .planet { fill: #E9EDF0 }
      .crater { fill: #5E666B }
      .scopulus { fill: #DA1428 }
    }
  </style>
  <circle class="planet" cx="16" cy="16" r="13.5"/>
  <circle class="scopulus" cx="10.2" cy="10.5" r="4.4"/>
  <circle class="crater" cx="21.6" cy="20.2" r="3.2"/>
  <circle class="crater" cx="22.6" cy="9.2" r="2.2"/>
  <circle class="crater" cx="10.4" cy="21.4" r="2"/>
</svg>
