<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- scopulus — IAU 행성 지형 명명 용어(불규칙하고 들쭉날쭉한 절벽)에서 온 이름.
       마크는 그 지형이 팬 암체이고, 붉은 크레이터가 scopulus 의 자리다. -->
  <style>
    .planet { fill: #15171A }
    .crater { fill: #9AA1A6 }
    .scopulus { fill: #E8182E }
